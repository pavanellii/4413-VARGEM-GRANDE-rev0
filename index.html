<title>Programação Semanal 4413</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: faixa de obra (Montcalm · Vale), abas, planejador com tabela à esquerda e Gantt em dias à direita */
:root{
  --bg:#F2F1EE; --surface:#FFFFFF; --surface-2:#F7F6F3; --line:#DCD8D1; --line-2:#ECE9E4;
  --fg:#22211E; --muted:#6B675F;
  --mc:#E8641F; --mc-ink:#B4500C; --mc-soft:#FBE8D9;
  --vale:#00857F; --vale-ink:#006A66; --vale-soft:#DCEFEC; --vy:#EDB111;
  --ok:#2F8A47; --ok-soft:#E1F2E4; --warn:#9A6C05; --warn-soft:#FBF0D4; --bad:#C23A2E; --bad-soft:#F9E1DE;
  --band:#2A2927; --band-fg:#F1EFEA; --band-muted:#B5B0A7;
  --sel:#FFF4E6;
  --shadow:0 10px 30px rgba(30,25,20,.16);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161615; --surface:#201F1D; --surface-2:#282725; --line:#3A3835; --line-2:#2E2D2A;
  --fg:#EDEBE6; --muted:#A39E95;
  --mc:#F08A3C; --mc-ink:#F5A266; --mc-soft:#3B2716;
  --vale:#2DB3AC; --vale-ink:#5CCBC4; --vale-soft:#12302E; --vy:#F0BD3A;
  --ok:#5CC27A; --ok-soft:#173322; --warn:#E0AE3C; --warn-soft:#352A10; --bad:#EE6F62; --bad-soft:#3A1A17;
  --band:#0E0E0D; --band-fg:#EDEBE6; --band-muted:#9C978E; --sel:#33271B; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161615; --surface:#201F1D; --surface-2:#282725; --line:#3A3835; --line-2:#2E2D2A;
  --fg:#EDEBE6; --muted:#A39E95;
  --mc:#F08A3C; --mc-ink:#F5A266; --mc-soft:#3B2716;
  --vale:#2DB3AC; --vale-ink:#5CCBC4; --vale-soft:#12302E; --vy:#F0BD3A;
  --ok:#5CC27A; --ok-soft:#173322; --warn:#E0AE3C; --warn-soft:#352A10; --bad:#EE6F62; --bad-soft:#3A1A17;
  --band:#0E0E0D; --band-fg:#EDEBE6; --band-muted:#9C978E; --sel:#33271B; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mc);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--muted);background:var(--surface-2)}

/* faixa */
.band{background:var(--band);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:3px solid var(--mc)}
.band-in{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.marks{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.06em}
.marks .m{color:var(--mc)} .marks .v{color:#3CC0B8} .marks .sep{width:1px;height:20px;background:var(--band-muted);opacity:.5}
.hinfo{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--band-muted);flex:1;min-width:0}
.hinfo b{color:var(--band-fg);font-weight:600}
.hact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.saved{font-size:12px;color:var(--band-muted)}
.btn-band{background:transparent;border:1px solid #57534d;color:var(--band-fg);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
.btn-band:hover{border-color:var(--mc);color:#fff}
.tabs{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.tabs-in{display:flex;align-items:center;gap:10px}
.tabs-l{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.tabs-in .saved{color:var(--muted);white-space:nowrap}
.top{background:var(--surface);border-bottom:4px solid var(--mc);box-shadow:0 3px 0 var(--vale);margin-bottom:3px}
.top-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding-block:14px}
.logo{height:70px;min-width:160px;max-width:240px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;padding:8px 14px;border:1px solid var(--line)}
.logo img{max-height:54px;max-width:100%;object-fit:contain;display:block}
.logo.noimg{flex-direction:column;cursor:pointer;border-style:dashed;gap:2px}
.logo.noimg:hover{border-color:var(--mc);box-shadow:0 0 0 3px var(--mc-soft)}
.wm{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.06em;line-height:1}
.wm.mc{color:#E8641F}.wm.vale{color:#00857F}
.logo small{font-size:11px;color:#8a857d}
.ttl{min-width:0;text-align:center}
.ttl h1{font-size:30px;line-height:1.08;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.chips span{background:var(--surface-2);border:1px solid var(--line-2);border-radius:20px;padding:2px 10px}
.chips b{color:var(--fg);font-weight:600}
.chips .wkchip{background:var(--mc-soft);border-color:transparent;color:var(--mc-ink)}
.logobox{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
@media (max-width:900px){.top-in{grid-template-columns:1fr 1fr;gap:12px}.ttl{grid-column:1/-1;order:3}.logo{height:54px;min-width:0;width:100%}.top-in .logo:last-of-type{justify-self:end}.ttl h1{font-size:22px}}

.top{background:linear-gradient(to right,var(--mc) 0 75%,var(--vale) 75% 87.5%,var(--vy) 87.5%) bottom/100% 6px no-repeat,#FFFFFF;padding-bottom:6px;border-bottom:1px solid var(--line);box-shadow:none;margin-bottom:0}
.top .logo{border:0;padding:0;background:transparent;min-width:0;height:auto;max-width:none}
.top .logo img{height:50px;max-height:none;width:auto;max-width:100%}
.top .logo:last-child img{height:44px}
.top .ttl h1{color:#2B2B2A}
.top .eyebrow{color:#E8641F}
.top .chips{color:#5A5650}
.top .chips span{background:#F4F2EF;border-color:#E6E2DC}
.top .chips b{color:#2B2B2A}
.top .chips .wkchip{background:#FCE6D8;color:#B4500C}
.top .logo.noimg{border:1px dashed #ccc;padding:8px 14px}
.logobox .logo{height:76px;min-width:220px}
.logobox .logo img{max-height:56px}
@media (max-width:640px){.tabs-in .saved{display:none}}
@media (max-width:900px){.top .logo img{height:36px}.top .logo:last-child img{height:32px}}
/* calendário */
.calp{position:fixed;z-index:46;width:300px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--vale);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cal-h b{font-family:var(--f-display);font-size:18px;text-transform:capitalize}
.cal-h .ic{font-size:15px;padding:6px 10px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-g .dw{font-size:11px;text-align:center;color:var(--muted);font-weight:600}
.cal-g button{height:34px;border:1px solid transparent;border-radius:6px;background:var(--surface-2);cursor:pointer;font-family:var(--f-mono);font-size:12.5px;padding:0}
.cal-g button:hover{border-color:var(--mc)}
.cal-g button.out{opacity:.45}
.cal-g button.off{background:transparent;color:var(--muted);text-decoration:line-through}
.cal-g button.span{background:var(--mc-soft);color:var(--mc-ink)}
.cal-g button.wk{box-shadow:inset 0 -3px 0 var(--vy)}
.cal-g button.td{border-color:var(--bad)}
.cal-g button.sel{background:var(--mc);color:#fff;font-weight:600}
.dbtn{height:28px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-family:var(--f-mono);font-size:12px;cursor:pointer;text-align:left;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.dbtn:hover:not(:disabled){border-color:var(--mc);background:var(--mc-soft)}
.dbtn.fx{border-color:var(--mc);box-shadow:inset 3px 0 0 var(--mc)}
.dbtn.auto{color:var(--muted)}
.dbtn.nodate{color:var(--mc-ink);font-family:var(--f-body);font-weight:600}
.dbtn:disabled{opacity:.5;cursor:default}
.tab{border:0;background:none;padding:12px 10px 10px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14.5px;letter-spacing:.03em;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--mc)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:1px 6px;margin-left:6px}
main{padding-block:16px 60px}

/* controles */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--mc);border-color:var(--mc);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.vale{background:var(--vale);border-color:var(--vale);color:#fff}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ic{border:0;background:none;cursor:pointer;color:var(--muted);padding:3px 5px;border-radius:4px;font-size:13px;line-height:1}
.ic:hover{background:var(--line-2);color:var(--fg)}
.ic.del:hover{color:var(--bad)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:5px 7px;min-width:0}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
textarea{resize:vertical;width:100%}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f > input,label.f > select,label.f > textarea{color:var(--fg);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.pad{padding:16px}
.hint{font-size:12.5px;color:var(--muted)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:12.5px}
.seg2 button+button{border-left:1px solid var(--line)}
.seg2 button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.st{display:inline-block;font-size:11.5px;font-weight:600;border-radius:4px;padding:2px 7px;white-space:nowrap;border:2px solid transparent}
button.st{cursor:pointer;font-family:inherit}
.st-nao{background:var(--line-2);color:var(--muted)}
.st-and{background:var(--warn-soft);color:var(--warn)}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-imp{background:var(--bad-soft);color:var(--bad)}
.st[aria-pressed="true"]{border-color:currentColor}
.ph{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.1em;border-radius:3px;padding:1px 6px}
.ph-D{background:var(--mc-soft);color:var(--mc-ink)} .ph-M{background:var(--vale-soft);color:var(--vale-ink)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;border-radius:10px;padding:1px 7px;cursor:pointer;border:0;font-weight:600}
.b-p{background:var(--warn-soft);color:var(--warn)} .b-i{background:var(--bad-soft);color:var(--bad)}
.b-par{background:var(--vale-soft);color:var(--vale-ink);cursor:default}
.late{color:var(--bad);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--muted)}
.ix{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* seletor de filtros */
.fbar{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px;margin-bottom:10px}.fbar>*{flex:none}
.fchip{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;cursor:pointer;min-width:96px}
.pzl{position:absolute;top:0;bottom:0;width:2px;background:#C0392B;z-index:3;pointer-events:none}.pzl.ini{background:#5B8DB8;opacity:.6}.pzl span{position:absolute;top:2px;left:4px;font-size:10.5px;font-weight:700;color:#C0392B;white-space:nowrap;background:var(--surface);padding:0 3px;border-radius:3px}
.g-rows{position:relative}
.prow.opz{background:rgba(192,57,43,.08)}.prow.opz .nm{color:#C0392B;font-weight:700}.prow.opz .xc.dbtn{color:#C0392B;border-color:#E3A69C}
.g-bar.opz{outline:2px solid #C0392B;outline-offset:1px}
.fchip.over{border-color:#C0392B;background:rgba(192,57,43,.06)}.fchip .ov{font-size:10.5px;font-weight:700;color:#fff;background:#C0392B;border-radius:8px;padding:0 6px;align-self:flex-start}
.fchip .eq{font-size:10.5px;color:var(--muted);line-height:1}
.pzbox{display:flex;gap:8px;align-items:flex-end;border:1.5px solid var(--line);border-radius:7px;padding:4px 8px 6px;background:var(--surface-2)}.pzbox.over{border-color:#C0392B}
.fchip:hover{border-color:var(--muted)}
.fchip[aria-pressed="true"]{border-color:var(--mc);box-shadow:inset 0 -3px 0 var(--mc)}
.fchip .tg{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1.1}
.fchip .dt{font-size:11px;color:var(--muted);white-space:nowrap}
.fchip .bar{height:3px;background:var(--line-2);border-radius:2px;overflow:hidden}
.fchip .bar i{display:block;height:100%;background:var(--ok)}
.fhead{display:flex;gap:14px;flex-wrap:wrap;align-items:end;padding:12px 14px;border-bottom:1px solid var(--line)}
.tagin{font-family:var(--f-display);font-weight:700;font-size:26px;width:110px;border-color:transparent!important;background:transparent!important;padding:0 4px}
.fstats{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:8px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px}
.fstats b{font-family:var(--f-mono);font-weight:500}
.warnmk{color:var(--warn);font-size:12.5px}

/* planejador */
.pl{display:flex;align-items:stretch;min-width:0}
.pl-l{flex:none;width:860px;border-right:2px solid var(--line);background:var(--surface);min-width:0;position:relative}
.pl-split{position:absolute;top:0;bottom:0;right:-5px;width:9px;cursor:col-resize;z-index:5;touch-action:none}
.pl-split:hover,.pl-split.on{background:linear-gradient(to right,transparent 3px,var(--mc) 3px,var(--mc) 6px,transparent 6px)}
.pl-l.cmp{width:440px!important}
.pl-r{flex:1;min-width:0;overflow-x:auto;position:relative}
.pl-h{height:48px;border-bottom:1px solid var(--line);position:sticky;top:0}
.pl-l .pl-h{display:grid;align-items:end;padding-bottom:6px;font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prow{display:grid;align-items:center;height:36px;border-bottom:1px solid var(--line-2);padding:0 4px;gap:4px}
.pl-l .prow,.pl-l .pl-h{grid-template-columns:18px 24px minmax(150px,1fr) 52px 122px 122px 116px 26px 54px 44px 24px}
.pl-l.cmp .prow,.pl-l.cmp .pl-h{grid-template-columns:18px 24px minmax(150px,1fr) 56px 26px 26px 24px}
.pl-l.cmp .xc{display:none}
.prow.sel,.gr.sel{background:var(--sel)}
.prow:hover{background:var(--surface-2)}
.prow.sel:hover{background:var(--sel)}
.prow.done .nm{color:var(--muted);text-decoration:line-through}
.prow.phr,.gr.phr{height:32px;background:var(--surface-2)}
.prow.phr{display:flex;gap:10px;padding:0 10px}
.phl{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:13px}
.prow input,.prow select{height:28px;padding:2px 6px;font-size:13px}
.prow .nm{border-color:transparent;background:transparent;font-weight:500;width:100%}
.prow .nm:hover,.prow .nm:focus{border-color:var(--line);background:var(--surface)}
.prow .dn{text-align:right;font-family:var(--f-mono);width:100%}
.prow input[type=date]{font-family:var(--f-mono);font-size:12px;width:100%}
.prow input.fx{border-color:var(--mc);box-shadow:inset 3px 0 0 var(--mc)}
.prow input.auto{color:var(--muted)}
.prow select{width:100%}
.drag{cursor:grab;color:var(--muted);user-select:none;font-size:15px;text-align:center}
.sdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;background:var(--surface)}
.sdot.s-and{background:var(--warn-soft);border-color:var(--warn)}
.sdot.s-ok{background:var(--ok);border-color:var(--ok)}
.sdot.s-imp{background:var(--bad);border-color:var(--bad)}
.ptg{width:24px;height:24px;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;font-weight:700;color:var(--muted);padding:0}
.ptg.on{background:var(--vale);border-color:var(--vale);color:#fff}
.pnw{display:flex;gap:4px}.ptg.nib{font-size:9px;letter-spacing:.02em}.ptg.nib.on{background:#8E6CC0;border-color:#8E6CC0}
.pl-l.cmp .nib{display:none}@media (max-width:1100px){.nib{display:none}}
.prow.nirow{box-shadow:inset 3px 0 0 #8E6CC0}.prow.nirow .nm{font-style:italic}
.g-bar.ni{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.38) 0 4px,transparent 4px 8px)!important}
.prow.drop-before{box-shadow:inset 0 2px 0 var(--mc)}
.prow.drop-after{box-shadow:inset 0 -2px 0 var(--mc)}

/* Gantt */
.gp{position:relative}
.gh{position:relative;height:48px;border-bottom:1px solid var(--line);background:var(--surface)}
.gh-wr,.gh-dr{position:absolute;left:0;right:0}
.gh-wr{top:0;height:24px;border-bottom:1px solid var(--line-2)}
.gh-dr{top:24px;height:24px}
.gh-w{position:absolute;top:0;bottom:0;border:0;border-left:1px solid var(--line);background:none;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:left;padding:0 5px;cursor:pointer;white-space:nowrap;overflow:hidden}
.gh-w:hover{background:var(--surface-2);color:var(--fg)}
.gh-w.on{background:var(--warn-soft);color:var(--fg);font-weight:600}
.gh-d{position:absolute;top:0;bottom:0;font-size:10.5px;text-align:center;color:var(--muted);line-height:1.05;padding-top:2px;border-left:1px solid var(--line-2)}
.gh-d b{display:block;font-family:var(--f-mono);font-weight:500;color:var(--fg);font-size:11px}
.gh-d.off{background:var(--line-2)} .gh-d.off b{color:var(--muted)}
.gh-d.td{background:var(--bad-soft)} .gh-d.td b{color:var(--bad)}
.g-rows{position:relative}
.g-bg{position:absolute;inset:0;background-image:linear-gradient(to right,var(--line-2) 1px,transparent 1px);pointer-events:none}
.g-off{position:absolute;top:0;bottom:0;background:var(--line-2);opacity:.75}
.g-wl{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}

function newAtiv(t){return{id:uid(),tid:t.id||'',fase:t.fase,nome:t.nome,dur:t.dur||'',enc:'',par:'',ini:'',status:'nao',pct:0,rac:[],obs:'',pend:[],imp:[],rIni:'',rFim:'',causa:'',bl:null}}

        if(a.rIni)s=dateToOff(parseISO(a.rIni));else if(a.ini)s=dateToOff(parseISO(a.ini));else s=nc?(cE??base):(f.seqPrev&&pE!=null)?pE:mx;

/* --- Semana --- */
function wkBar(extra=''){const W=week();return`<div class="wkbar">
  <button class="btn" data-a="wk" data-v="-7" aria-label="Semana anterior">◀</button>
  <span class="wkt">Semana <input type="number" id="semnum-${U.tab}" value="${W.n}" data-c="semnum" aria-label="Número da semana"></span>
  <span class="muted">${DNL[1]} ${fDY(W.ws)} a ${DNL[6]} ${fDY(W.dl)}</span>
  <button class="btn" data-a="wk" data-v="7" aria-label="Próxima semana">▶</button>
  <input type="date" id="wkdate-${U.tab}" value="${iso(W.ws)}" data-c="wkdate" aria-label="Escolher semana">
  <span style="flex:1"></span>${extra}
  <label class="f">Filtro<select id="sf-${U.tab}" data-u="sem.f">${opt('','Todos',U.sem.f)}${S.filtros.map(f=>opt(f.id,f.tag,U.sem.f)).join('')}</select></label>
  <label class="f">Encarregado<select id="se-${U.tab}" data-u="sem.e">${encOpts(U.sem.e,'Todos')}</select></label>
  <button class="btn vale" data-a="rep" data-v="semana">Emitir programação</button><button class="btn" data-a="rep" data-v="todsem" title="Programação semanal de todos os encarregados juntos">Por encarregado</button><button class="btn" data-a="rep-dia" data-v="" title="Programação diária de hoje">Diária</button></div>`}
function weekKpis(W,items){const ini=items.filter(it=>it.sc.i0>=W.i0).length,endIn=items.filter(it=>it.sc.i1<=W.i6),okIn=endIn.filter(it=>it.a.status==='ok');
  const pAb=items.reduce((s,it)=>s+it.a.pend.filter(p=>!p.ok).length,0);const dImp=allImp().filter(x=>inWeekDate(W,x.m.data)).reduce((s,x)=>s+num(x.m.dias),0);
  const fr=new Set(items.map(it=>it.f.id)).size;
  return`<div class="kpis"><div class="kpi"><div class="v">${items.length}</div><div class="l">atividades na semana</div></div><div class="kpi"><div class="v">${fr}</div><div class="l">filtros em execução</div></div><div class="kpi"><div class="v">${ini} / ${endIn.length}</div><div class="l">iniciam / terminam na semana</div></div><div class="kpi"><div class="v">${endIn.length?fH(okIn.length/endIn.length*100)+'%':'–'}</div><div class="l">PPC (${okIn.length} de ${endIn.length} concluídas)</div></div><div class="kpi"><div class="v" style="color:${pAb?'var(--bad)':'inherit'}">${pAb}</div><div class="l">pendências abertas</div></div><div class="kpi"><div class="v">${fH(dImp)}</div><div class="l">dias impactados na semana</div></div></div>`}
VIEWS.sem=()=>{const W=week();const items=weekItems(W,U.sem);const px=U.pxW;const i0=W.i0,n=6;
  let L='',R='';S.filtros.forEach(f=>{const arr=items.filter(it=>it.f.id===f.id);if(!arr.length)return;
    L+=`<div class="wlab grp">${esc(f.tag)} <small style="font-family:var(--f-body);font-weight:400;font-size:12px;letter-spacing:0">· ${arr.length} ativ. · ${fH(fProg(f))}%</small></div>`;R+=`<div class="gr grp"></div>`;
    arr.forEach(it=>{const a=it.a;L+=`<div class="wlab" data-a="pop" data-id="${a.id}" title="${esc(a.nome)}"><span class="ix">${pad(it.i+1)}</span>${esc(a.nome)} <small>${esc(encName(a.enc))}</small></div>`;R+=`<div class="gr">${gBar(a,f,it.i,i0,px)}</div>`})});
  return wkBar()+weekKpis(W,items)+`<section class="card" style="min-width:0">
   ${items.length?`<div class="pl"><div class="pl-l" style="width:300px"><div class="pl-h" style="display:flex;align-items:end;padding:0 10px 6px"><span class="eyebrow">Filtro · atividade</span></div>${L}</div>
   <div class="pl-r" data-ks="gsem"><div class="gp" style="width:${n*px}px;min-width:100%" data-i0="${i0}" data-px="${px}">${gHead(i0,n,px)}<div class="g-rows">${gBg(i0,n,px)}${R}</div></div></div></div>`:`<div class="empty">Nenhuma atividade nesta semana. Defina o início dos filtros e as durações na aba Programação.</div>`}
   <div class="keys"><span>Arraste a barra para mudar o início · puxe a borda direita para mudar a duração · clique na barra ou no nome para editar.</span><span style="flex:1"></span>${S.enc.length?S.enc.map(e=>`<span><i class="sw" style="background:${encColor(e.id)}"></i> ${esc(e.nome)}</span>`).join(''):''}</div></section>`};

VIEWS.quadro=()=>{const W=week();const items=weekItems(W,U.sem);const noStart=S.filtros.filter(f=>FSTART[f.id]==null);
  const cols=W.days.map((d,k)=>{const i=W.i0+k,cap=W.caps[k];
    const its=items.filter(it=>cap&&i>=it.sc.i0&&i<=it.sc.i1).sort((x,y)=>x.sc.s-y.sc.s);
    return`<div class="col ${cap?'':'folga'}" data-dropday="${k}"><div class="col-h"><div style="display:flex;justify-content:space-between;align-items:center;gap:6px"><b>${DN[d.getDay()]} ${fD(d)}</b>${cap?`<button class="ic" data-a="rep-dia" data-v="${k}" title="Imprimir a programação deste dia" aria-label="Imprimir dia">🖨</button>`:''}</div><span class="hint">${cap?`${its.length} atividade(s) · ${new Set(its.map(x=>x.f.id)).size} filtro(s)`:'folga'}</span></div>
    <div class="col-b">${its.map(it=>kcard(it,i)).join('')||`<div class="hint" style="text-align:center;padding:18px 4px">${cap?'Solte atividades ou filtros aqui':'Sem trabalho'}</div>`}</div></div>`}).join('');
  return wkBar()+`${noStart.length?`<div class="backlog"><span class="hint">Filtros sem início — arraste para um dia:</span>${noStart.map(f=>`<span class="fdrag" draggable="true" data-fdrag="${f.id}">${esc(f.tag)}</span>`).join('')}</div>`:''}
  <div class="board" data-ks="board">${cols}</div>
  <p class="hint">Arraste um cartão para outro dia para mudar o início · clique no status para avançar · clique no cartão para editar.</p>`};
function kcard(it,i){const a=it.a,sc=it.sc;const col=encColor(a.enc)||(a.fase==='DESMONTAGEM'?'var(--mc)':'var(--vale)');const pa=a.pend.filter(x=>!x.ok).length;
  let k=0;for(let j=sc.i0;j<=i;j++)if(CAL.cap[j])k++;const tot=Math.ceil(num(a.dur));
  return`<div class="kc ${a.status==='ok'?'done':''}" style="--c:${col}" draggable="true" data-card="${a.id}" data-a="pop" data-id="${a.id}">
  <div class="kt"><span class="tg">${esc(it.f.tag)}</span><span class="ix">${pad(it.i+1)}</span>${phChip(a.fase)}${a.ini?'<span title="Início fixo">📌</span>':''}</div>
  <div class="kn">${esc(a.nome)}</div>
  <div class="tm">dia ${k} de ${tot} · ${fD(dayDate(sc.i0))} → ${fD(dayDate(sc.i1))}</div>
  <div class="ft"><button class="st st-${a.status}" data-a="st-cycle" data-id="${a.id}" title="Clique para avançar o status">${stTxt(a.status)}</button>${a.enc?`<span class="hint">${esc(encName(a.enc))}</span>`:''}${a.par&&AIDX[a.par]?`<span class="badge b-par">∥ ${pad(AIDX[a.par].i+1)}</span>`:''}${pa?`<span class="badge b-p">● ${pa}</span>`:''}</div></div>`}

  const list=allPend().filter(x=>(U.pend.st==='todas'||(U.pend.st==='ab'?!x.p.ok:x.p.ok))&&(!U.pend.f||x.f.id===U.pend.f)&&(!U.pend.e||x.a.enc===U.pend.e)&&(!q||(x.p.desc+' '+x.a.nome+' '+x.p.resp).toLowerCase().includes(q)))
    .sort((a,b)=>(a.p.ok-b.p.ok)||String(a.p.prazo||'9').localeCompare(String(b.p.prazo||'9')));

  const g=U.gp;
  return`<div class="split"><div style="min-width:0">
    <div class="toolbar">
      <label class="f">Situação<select id="pst" data-u="pend.st">${opt('ab','Abertas',U.pend.st)}${opt('res','Resolvidas',U.pend.st)}${opt('todas','Todas',U.pend.st)}</select></label>

      <label class="f" style="flex:1;min-width:160px">Buscar<input type="text" id="pq" value="${esc(U.pend.q)}" data-u="pend.q" data-live="1" data-rr="1" placeholder="texto, atividade, responsável"></label>
      <button class="btn vale" data-a="rep" data-v="pend">Emitir relatório</button></div>
    <div class="card tw" data-ks="ptbl"><table class="t" style="min-width:860px"><thead><tr><th>OK</th><th>Filtro</th><th>Atividade</th><th>Pendência</th><th>Tipo</th><th>Responsável</th><th>Prazo</th><th>Encarregado</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">Nenhuma pendência nesta seleção.</td></tr>'}</tbody></table></div>
  </div>
  <div class="card pad" style="display:flex;flex-direction:column;gap:10px"><h3>Nova pendência</h3>
    <label class="f">Filtro<select id="gpf" data-u="gp.f">${fSelOpts(g.f,'— filtro —')}</select></label>
    <label class="f">Atividade<select id="gpa" data-u="gp.a">${aSelOpts(g.f,g.a)}</select></label>
    <label class="f">Descrição<textarea id="gpd" rows="2" data-u="gp.desc" data-live="1">${esc(g.desc)}</textarea></label>
    <label class="f">Tipo<select id="gpt" data-u="gp.tipo">${TIPOS_PEND.map(x=>opt(x,x,g.tipo)).join('')}</select></label>
    <div class="row"><label class="f" style="flex:1">Responsável<input type="text" id="gpr" value="${esc(g.resp)}" data-u="gp.resp" data-live="1"></label><label class="f">Prazo<input type="date" id="gpp" value="${esc(g.prazo)}" data-u="gp.prazo"></label></div>
    <button class="btn pri" data-a="gp-add">Adicionar pendência</button></div></div>`};

/* --- Impactos --- */
VIEWS.imp=()=>{const W=week();
  const list=allImp().filter(x=>(U.imp.per==='todos'||inWeekDate(W,x.m.data))&&(!U.imp.f||x.f.id===U.imp.f)&&(!U.imp.t||x.m.tipo===U.imp.t)).sort((a,b)=>String(b.m.data).localeCompare(String(a.m.data)));
  const byT={},byR={};let td=0;list.forEach(({m})=>{const d=num(m.dias);td+=d;byT[m.tipo]=(byT[m.tipo]||0)+d;byR[m.resp]=(byR[m.resp]||0)+d});
  const mx=Math.max(1e-9,...Object.values(byT)),mr=Math.max(1e-9,...Object.values(byR));
  const rows=list.map(({f,a,i,m})=>`<tr><td class="mono">${m.data?fDY(parseISO(m.data)):'–'}</td><td><b>${esc(f.tag)}</b></td><td><a href="#" data-a="a-open" data-id="${a.id}" style="color:inherit">${pad(i+1)} ${esc(a.nome)}</a></td><td>${esc(m.tipo)}</td><td>${esc(m.resp)}</td><td class="num" style="text-align:right">${fH(num(m.dias))}</td><td>${esc(m.desc)}</td><td><button class="ic del" data-a="m-del" data-id="${a.id}" data-p="${m.id}" title="Excluir">✕</button></td></tr>`).join('');
  const g=U.gi;const bars=(o,m,c)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="sumbar"><span>${esc(k)}</span><span class="tr"><i style="width:${v/m*100}%;${c}"></i></span><span class="num">${fH(v)} d</span></div>`).join('')||'<span class="muted">–</span>';
  return`<div class="split"><div style="min-width:0">
    <div class="toolbar">
      <label class="f">Período<select id="ip" data-u="imp.per">${opt('sem',`Semana ${W.n} (${fD(W.ws)}–${fD(W.dl)})`,U.imp.per)}${opt('todos','Todo o período',U.imp.per)}</select></label>
      <label class="f">Filtro<select id="if" data-u="imp.f">${fSelOpts(U.imp.f,'Todos')}</select></label>
      <label class="f">Tipo<select id="it" data-u="imp.t">${opt('','Todos',U.imp.t)}${TIPOS_IMP.map(x=>opt(x,x,U.imp.t)).join('')}</select></label>
      <span style="flex:1"></span><button class="btn vale" data-a="rep" data-v="imp">Emitir relatório</button></div>
    <div class="kpis"><div class="kpi"><div class="v">${list.length}</div><div class="l">impactos registrados</div></div><div class="kpi"><div class="v">${fH(td)}</div><div class="l">dias perdidos</div></div><div class="kpi"><div class="v">${new Set(list.map(x=>x.f.id)).size}</div><div class="l">filtros afetados</div></div></div>
    <div class="card tw" data-ks="itbl"><table class="t" style="min-width:820px"><thead><tr><th>Data</th><th>Filtro</th><th>Atividade</th><th>Tipo</th><th>Responsabilidade</th><th style="text-align:right">Dias</th><th>Descrição</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">Nenhum impacto nesta seleção.</td></tr>'}</tbody></table></div>
    <div class="two"><div class="card pad"><h3 style="margin-bottom:10px">Dias por tipo</h3>${bars(byT,mx,'')}</div><div class="card pad"><h3 style="margin-bottom:10px">Dias por responsabilidade</h3>${bars(byR,mr,'background:var(--warn)')}</div></div>
  </div>
  <div class="card pad" style="display:flex;flex-direction:column;gap:10px"><h3>Registrar impacto</h3>
    <label class="f">Filtro<select id="gif" data-u="gi.f">${fSelOpts(g.f,'— filtro —')}</select></label>
    <label class="f">Atividade<select id="gia" data-u="gi.a">${aSelOpts(g.f,g.a)}</select></label>
    <div class="row"><label class="f">Data<input type="date" id="gid" value="${esc(g.data)}" data-u="gi.data"></label><label class="f" style="width:100px">Dias perdidos<input type="number" min="0" step="0.5" id="gidd" value="${esc(g.d)}" data-u="gi.d" data-live="1"></label></div>
    <label class="f">Tipo<select id="git" data-u="gi.tipo">${TIPOS_IMP.map(x=>opt(x,x,g.tipo)).join('')}</select></label>
    <label class="f">Responsabilidade<select id="gir" data-u="gi.resp">${RESP_IMP.map(x=>opt(x,x,g.resp)).join('')}</select></label>
    <label class="f">Descrição<textarea id="gids" rows="3" data-u="gi.desc" data-live="1" placeholder="ex.: PTS liberada só à tarde">${esc(g.desc)}</textarea></label>
    <button class="btn pri" data-a="gi-add">Registrar impacto</button></div></div>`};

/* --- Encarregados --- */
function encCadastro(W){const items=weekItems(W);
  const rows=S.enc.map(e=>{const mine=items.filter(it=>it.a.enc===e.id);const tot=S.filtros.reduce((s,f)=>s+f.ativ.filter(a=>a.enc===e.id).length,0);
    return`<tr><td><input type="color" id="ec-${e.id}" value="${esc(encColor(e.id))}" data-c="enc-f" data-id="${e.id}" data-k="cor" aria-label="Cor" style="width:34px;height:28px;padding:0;border:0;background:none"></td>
    <td><input type="text" id="en-n-${e.id}" value="${esc(e.nome)}" data-c="enc-f" data-id="${e.id}" data-k="nome" style="width:100%"></td>
    <td><input type="text" id="en-f-${e.id}" value="${esc(e.frente)}" data-c="enc-f" data-id="${e.id}" data-k="frente" style="width:100%"></td>
    <td><input type="text" id="en-c-${e.id}" value="${esc(e.contato)}" data-c="enc-f" data-id="${e.id}" data-k="contato" style="width:100%"></td>
    <td class="num" style="text-align:right">${tot}</td><td class="num" style="text-align:right">${mine.length}</td><td class="num" style="text-align:right">${fH(mine.reduce((s,it)=>s+it.dw,0))}</td>
    <td><button class="ic del" data-a="enc-del" data-id="${e.id}" title="Remover">✕</button></td></tr>`}).join('');
  const n=U.ne;
  return`<div class="card pad" style="margin-bottom:14px"><h3 style="margin-bottom:10px">Adicionar encarregado</h3><div class="row">
    <label class="f" style="flex:2;min-width:180px">Nome<input type="text" id="nen" value="${esc(n.nome)}" data-u="ne.nome" data-live="1"></label>
    <label class="f" style="flex:2;min-width:160px">Frente / disciplina<input type="text" id="nef" value="${esc(n.frente)}" data-u="ne.frente" data-live="1" placeholder="ex.: Mecânica, Caldeiraria, Andaime"></label>
    <label class="f" style="flex:1;min-width:140px">Contato<input type="text" id="nec" value="${esc(n.contato)}" data-u="ne.contato" data-live="1"></label>
    <button class="btn pri" data-a="enc-add">Adicionar</button></div></div>
  <div class="card tw"><table class="t" style="min-width:760px"><thead><tr><th>Cor</th><th>Nome</th><th>Frente</th><th>Contato</th><th style="text-align:right">Ativ. total</th><th style="text-align:right">Ativ. sem. ${W.n}</th><th style="text-align:right">Dias na sem.</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="8" class="empty">Cadastre os encarregados para associá-los às atividades.</td></tr>'}</tbody></table></div>`};

const CRIT=[['seg','Segurança'],['qual','Qualidade'],['org','Organização']];
const todayI=()=>dayIdx(new Date());
const encMatch=(a,e)=>e==='_'?!a.enc:a.enc===e;
const encLabel=e=>e==='_'?'Sem encarregado':(encName(e)||'Encarregado');
function encList(){const L=S.enc.map(e=>({id:e.id,nome:e.nome,frente:e.frente,cor:encColor(e.id)}));if(S.filtros.some(f=>f.ativ.some(a=>!a.enc&&num(a.dur)&&SCH[a.id])))L.push({id:'_',nome:'Sem encarregado',frente:'',cor:'#B5ADA4'});return L}
const encIds=()=>U.encv.e?[U.encv.e]:encList().map(x=>x.id);
const getAval=(W,e)=>S.aval?.[W.wiso]?.[e]||{};
const avalMed=m=>{const v=CRIT.map(c=>+m[c[0]]).filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
function situ(a,sc,ti){if(a.status==='ok')return{t:'Concluída',c:'ok'};if(a.status==='imp')return{t:'Impedida',c:'bad'};
  if(sc.i1<ti){let n=0;for(let i=sc.i1+1;i<=ti;i++)if(CAL.cap[i])n++;n=Math.max(1,n);return{t:`Atrasada ${n} ${n>1?'dias':'dia'}`,c:'late'}}
  if(sc.i1===ti)return{t:'Termina hoje',c:'hoje'};if(sc.i0>ti)return{t:'A iniciar',c:'fut'};return{t:'No prazo',c:''}}
function encStats(e,W){const ti=todayI();const all=[];S.filtros.forEach(f=>f.ativ.forEach((a,i)=>{const sc=SCH[a.id];if(!sc||!num(a.dur)||!encMatch(a,e))return;all.push({f,a,i,sc})}));
  const wk=all.filter(x=>x.sc.i0<=W.i6&&x.sc.i1>=W.i0);const endIn=wk.filter(x=>x.sc.i1<=W.i6),okIn=endIn.filter(x=>x.a.status==='ok');
  const late=all.filter(x=>x.a.status!=='ok'&&x.sc.i1<ti);let t=0,p=0;all.forEach(x=>{const d=num(x.a.dur);t+=d;p+=d*pctA(x.a)/100});
  let dImp=0;all.forEach(x=>x.a.imp.forEach(m=>{if(inWeekDate(W,m.data))dImp+=num(m.dias)}));
  return{all,wk,endIn,okIn,ppc:endIn.length?okIn.length/endIn.length*100:null,late,av:t?p/t*100:0,imp:wk.filter(x=>x.a.status==='imp').length,pend:all.reduce((s,x)=>s+x.a.pend.filter(q=>!q.ok).length,0),dImp}}

const dI=v=>v?dayIdx(parseISO(v)):null;
const todayI2=()=>dayIdx(new Date());
function realDur(a){if(!a.rIni||!a.rFim)return null;return endOffOfDay(dI(a.rFim))-CAL.cum[dI(a.rIni)]}
function devFim(a){if(!a.bl||!a.rFim)return null;return endOffOfDay(dI(a.rFim))-endOffOfDay(dI(a.bl.f))}
function devIni(a){if(!a.bl||!a.rIni)return null;return CAL.cum[dI(a.rIni)]-CAL.cum[dI(a.bl.i)]}
const dvTxt=v=>v==null?'—':`<span class="dv ${v>0?'p':'z'}">${v>0?'+':''}${fH(v)} d</span>`;
const LIM=()=>({fr:Math.max(1,+S.cfg.limFrentes||2),so:Math.max(0,+S.cfg.limSobre||50),oc:Math.max(1,+S.cfg.limOcio||2)});
function allActs(){const L=[];S.filtros.forEach(f=>f.ativ.forEach((a,i)=>{if(!a.fora)L.push({f,a,i,sc:SCH[a.id]})}));return L}
function encLoad(e,W){const ds=W.days.map((_,k)=>W.caps[k]?0:null);let n=0;
  allActs().forEach(({a,sc})=>{if(!encMatch(a,e)||!sc||!(num(a.dur)||a.rFim))return;let on=false;
    W.days.forEach((_,k)=>{const i=W.i0+k;if(W.caps[k]&&i>=sc.i0&&i<=sc.i1){ds[k]++;on=true}});if(on)n++});
  const wd=ds.filter(x=>x!==null);const tot=wd.reduce((a,b)=>a+b,0);
  return{ds,n,carga:wd.length?tot/wd.length:0,pico:wd.length?Math.max(...wd):0,vazios:wd.filter(x=>x===0).length,picoDia:ds.findIndex(x=>x!==null&&x===Math.max(...wd))}}
function loadAll(W){const L=S.enc.map(e=>({e,L:encLoad(e.id,W)}));const act=L.filter(x=>x.L.n);const avg=act.length?act.reduce((s,x)=>s+x.L.carga,0)/L.length:0;const lim=LIM();
  L.forEach(x=>{const l=x.L;let c;
    if(!l.n)c={k:'zero',t:'Sem atividades'};
    else if(l.pico>lim.fr||(avg>0&&l.carga>avg*(1+lim.so/100)&&l.carga>1))c={k:'over',t:'Sobrecarregado'};
    else if(l.vazios>=lim.oc||(avg>0&&l.carga<avg*0.5))c={k:'low',t:'Pouca atividade'};
    else c={k:'ok',t:'Equilibrado'};x.c=c});return{L,avg,lim}}
function ppcWeek(i0,e){const i6=i0+5;let p=0,ok=0;

  allActs().forEach(({a,sc})=>{if(!encMatch(a,e))return;if(a.status==='ok')conc++;const dv=devFim(a);if(dv!=null){cd++;dS+=dv;if(dv<=0)noP++}

function phaseSpan(f,fase,real){const A=f.ativ.filter(a=>a.fase===fase&&(num(a.dur)||a.rFim));if(!A.length)return null;

  const B=A.filter(a=>a.bl);if(B.length<A.length)return null;return endOffOfDay(Math.max(...B.map(a=>dI(a.bl.f))))-CAL.cum[Math.min(...B.map(a=>dI(a.bl.i)))]}

    if(val==='p'){if(!a.rIni)ckSetReal(a,'rIni',dv);if(a.status==='nao')a.status='and';L.in=L.in||'s'}
    if(val==='n'){L.in=L.in||'n'}}

  <div class="card pad rep"><span class="eyebrow">Campo · diário</span><h3>Check-in / Check-out</h3><p class="hint">Por encarregado: primeiro as acumuladas que deviam ter encerrado (em vermelho, com dias de atraso), depois as programadas do dia. Colunas para marcar no campo: executa hoje?, concluiu / parcial % / não fez e motivo. Lance o resultado na aba Check-in/out.</p>
    <label class="f">Dia<input type="date" id="rck" value="${esc((U.ck&&U.ck.d)||todayISO())}" data-u="ck.d"></label>
    <div class="row"><button class="btn pri" data-a="rep" data-v="ck">Emitir</button><button class="btn" data-a="tab" data-v="ck">Abrir para lançar</button></div></div>
  <div class="card pad rep"><span class="eyebrow">Todos os encarregados juntos</span><h3>Programação por encarregado</h3><p class="hint">Um relatório só, agrupado por encarregado (com frente e quantidade de atividades). Atividades concluídas não aparecem; o que não foi realizado antes vem destacado em vermelho com os dias de atraso.</p>
    <label class="f">Dia (diária)<select id="rtd" data-u="rep.dia">${diaOpts}</select></label>
    
    <div class="row"><button class="btn pri" data-a="rep" data-v="todsem">Semanal</button><button class="btn" data-a="rep" data-v="todsemP" title="Sem atividades atrasadas — apenas o programado para a semana">Semanal só programadas</button><button class="btn pri" data-a="rep" data-v="toddia">Diária</button><button class="btn" data-a="rep" data-v="toddiaP" title="Só o que está programado para o dia — sem atividades atrasadas de semanas anteriores">Diária só programadas</button></div></div>
  <div class="card pad rep"><span class="eyebrow">Diária</span><h3>Programação diária</h3><p class="hint">Atividades do dia por filtro, com encarregado, dia da atividade (ex.: 2 de 3), término e caixa para marcar feito. Restrições abertas aparecem só se houver. Folha A4 em pé.</p>
    <label class="f">Dia<select id="rdd" data-u="rep.dia">${diaOpts}</select></label>
    
    <div class="row"><button class="btn pri" data-a="rep" data-v="dia">Emitir</button></div></div>
  <div class="card pad rep"><span class="eyebrow">Semanal</span><h3>Programação semanal</h3><p class="hint">Semana ${W.n} · ${fDY(W.ws)} a ${fDY(W.dl)}. Grade segunda a sábado com as atividades de cada filtro, início, término, dias, encarregado, paralelas, RAC, pendências e impactos.</p>
    
    <div class="row"><button class="btn pri" data-a="rep" data-v="semana">Emitir</button><button class="btn" data-a="rep" data-v="semanaP" title="Sem atividades atrasadas — apenas o programado para a semana">Só programadas</button><button class="btn" data-a="csv" data-v="semana">Excel (.csv)</button></div></div>
  <div class="card pad rep"><span class="eyebrow">Restrições</span><h3>Pendências</h3><p class="hint">Pendências por filtro e atividade, com responsável, prazo e atrasos destacados.</p>
    <label class="f">Situação<select id="rps" data-u="rep.pst">${opt('ab','Abertas',r.pst)}${opt('todas','Todas',r.pst)}</select></label>
    <div class="row"><button class="btn pri" data-a="rep" data-v="pend">Emitir</button><button class="btn" data-a="csv" data-v="pend">Excel (.csv)</button></div></div>
  <div class="card pad rep"><span class="eyebrow">Perdas</span><h3>Impactos</h3><p class="hint">Dias perdidos por tipo, responsabilidade e filtro, com a descrição de cada ocorrência.</p>
    <label class="f">Período<select id="rip" data-u="rep.iper">${opt('sem','Semana '+W.n,r.iper)}${opt('todos','Todo o período',r.iper)}</select></label>
    <div class="row"><button class="btn pri" data-a="rep" data-v="imp">Emitir</button><button class="btn" data-a="csv" data-v="imp">Excel (.csv)</button></div></div>
  <div class="card pad rep"><span class="eyebrow">Visão geral</span><h3>Situação dos ${S.filtros.length} filtros</h3><p class="hint">Início, término, prazo, avanço, atividade atual, pendências abertas e dias impactados.</p>
    <div class="row"><button class="btn pri" data-a="rep" data-v="geral">Emitir</button><button class="btn" data-a="csv" data-v="geral">Excel (.csv)</button></div></div>
  <div class="card pad rep"><span class="eyebrow">Por filtro</span><h3>Sequência completa do filtro</h3><p class="hint">Todas as atividades de desmontagem e montagem de um filtro, com datas, paralelismo e status.</p>
    <label class="f">Filtro<select id="rff" data-u="rep.ff">${S.filtros.map(f=>opt(f.id,f.tag,r.ff||U.fid)).join('')}</select></label>
    <div class="row"><button class="btn pri" data-a="rep" data-v="filtro">Emitir</button><button class="btn" data-a="csv" data-v="filtro">Excel (.csv)</button></div></div></div>`};

/* --- popover, menu, drawer --- */
function popHTML(){const{a,f,i}=AIDX[U.pop.id];const sc=SCH[a.id];const d=num(a.dur);const earlier=f.ativ.slice(0,i);
  const w=350,h=470;const left=Math.max(8,Math.min(U.pop.x-20,innerWidth-w-8));const top=U.pop.y+14+h>innerHeight?Math.max(8,U.pop.y-h-10):U.pop.y+14;
  const pa=a.pend.filter(p=>!p.ok);
  return`<div class="pop" style="left:${left}px;top:${top}px" role="dialog" aria-label="Edição rápida">
  <div class="pop-h"><span class="eyebrow">${esc(f.tag)} · ${pad(i+1)} · ${a.fase}</span><button class="ic" data-a="pop-close" aria-label="Fechar">✕</button></div>
  <div><b>${esc(a.nome)}</b><div class="hint mono">${sc&&d?`${fDd(sc.i0)} → ${fDd(sc.i1)} · ${dias(d)}`:'sem programação'}</div></div>
  <div class="pop-g">
    <span>Dias</span><div class="stp"><button class="btn sm" data-a="q-dur" data-v="-1">−1</button><button class="btn sm" data-a="q-dur" data-v="-0.5">−½</button><input type="number" min="0" step="0.5" id="qd" value="${esc(a.dur)}" data-c="a-f" data-id="${a.id}" data-k="dur" aria-label="Dias"><button class="btn sm" data-a="q-dur" data-v="0.5">+½</button><button class="btn sm" data-a="q-dur" data-v="1">+1</button></div>
    <span>Início</span><button class="dbtn ${a.ini?'fx':(sc?'auto':'nodate')}" style="height:32px" id="qi" data-a="cal" data-id="${a.id}" data-f="ini">${sc?(a.ini?'📌 ':'')+fDd(sc.i0):'＋ escolher data'}</button>
    <span>Término</span><button class="dbtn ${sc&&d?'':'nodate'}" style="height:32px" id="qt" data-a="cal" data-id="${a.id}" data-f="fim" ${sc?'':'disabled'}>${sc&&d?fDd(sc.i1):'—'}</button>
    <span>Encarregado</span><select id="qen" data-c="a-f" data-id="${a.id}" data-k="enc">${encOpts(a.enc)}</select>
    <span>Execução</span><select id="qpar" data-c="a-f" data-id="${a.id}" data-k="par">${opt('','Sequencial',a.par)}${earlier.map((x,j)=>opt(x.id,'∥ paralela a '+pad(j+1)+' '+x.nome.slice(0,24),a.par)).join('')}</select>
    <span>Status</span><div class="seg">${STATUS.map(([k,l])=>`<button class="st st-${k}" data-a="q-st" data-v="${k}" aria-pressed="${a.status===k}">${l}</button>`).join('')}</div>
  </div>
  ${a.ini?`<div class="hint">📌 Início fixo <button class="btn sm" data-a="q-unfix">Voltar à sequência</button></div>`:''}
  <div class="row" style="flex-wrap:nowrap"><input type="text" id="qpend" value="${esc(U.qp)}" data-u="qp" data-live="1" placeholder="Pendência rápida…" style="flex:1"><button class="btn sm" data-a="q-pend">+ Pendência</button></div>
  ${pa.length?`<div class="hint">● ${pa.map(p=>esc(p.desc)).join(' · ')}</div>`:''}
  <button class="btn" data-a="a-open" data-id="${a.id}">Detalhes, pendências e impactos →</button></div>`}
function menuHTML(){const{a,f,i}=AIDX[U.menu.id];const w=250,h=380;const left=Math.max(8,Math.min(U.menu.x,innerWidth-w-8)),top=Math.max(8,Math.min(U.menu.y,innerHeight-h-8));
  const b=(v,l,k,cls='')=>`<button class="${cls}" data-a="m-act" data-v="${v}" role="menuitem"><span>${l}</span>${k?`<kbd>${k}</kbd>`:''}</button>`;
  return`<div class="menu" style="left:${left}px;top:${top}px" role="menu"><div class="mh">${esc(f.tag)} · ${pad(i+1)} ${esc(a.nome.slice(0,28))}</div>
  ${b('det','Detalhes, pendências e impactos','Enter')}${b('ins','Inserir atividade abaixo','I')}${b('dup','Duplicar','D')}
  ${i>0||a.par?b('par',a.par?'Desmarcar paralela':'Marcar como paralela','P'):''}${a.ini?b('unfix','Voltar à sequência',''):''}
  ${b('up','Mover para cima','Alt ↑')}${b('down','Mover para baixo','Alt ↓')}
  <div class="mst">${STATUS.map(([k,l])=>`<button class="st st-${k}" data-a="m-st" data-v="${k}" aria-pressed="${a.status===k}">${l}</button>`).join('')}</div>
  ${b('del','Excluir atividade','Del','danger')}</div>`}
function drawerHTML(){const{a,f,i}=AIDX[U.drawer];const sc=SCH[a.id];const d=num(a.dur);const earlier=f.ativ.slice(0,i);
  const fld=(l,html,cls='')=>`<label class="f ${cls}">${l}${html}</label>`;
  const pend=a.pend.map(p=>`<div class="li ${p.ok?'res':''}"><input type="checkbox" class="chk" ${p.ok?'checked':''} data-a="p-tog" data-id="${a.id}" data-p="${p.id}" aria-label="Resolvida"><div><div class="t1">${esc(p.desc)}</div><div class="t2">${esc(p.tipo)}${p.resp?' · '+esc(p.resp):''}${p.prazo?` · prazo <span class="${!p.ok&&p.prazo<todayISO()?'late':''}">${fDY(parseISO(p.prazo))}</span>`:''}${p.ok&&p.okEm?' · resolvida em '+fDY(parseISO(p.okEm)):''}</div></div><button class="ic del" data-a="p-del" data-id="${a.id}" data-p="${p.id}" title="Excluir">✕</button></div>`).join('');
  const imp=a.imp.map(m=>`<div class="li"><span class="badge b-i">▲</span><div><div class="t1">${esc(m.tipo)} — ${dias(num(m.dias))}</div><div class="t2">${m.data?fDY(parseISO(m.data)):''} · ${esc(m.resp)}${m.desc?' · '+esc(m.desc):''}</div></div><button class="ic del" data-a="m-del" data-id="${a.id}" data-p="${m.id}" title="Excluir">✕</button></div>`).join('');
  const parallels=f.ativ.filter(x=>x.par===a.id);const np=U.np,ni=U.ni;
  return`<div class="dr-back" data-a="dr-close"></div><aside class="dr" role="dialog" aria-label="Detalhes da atividade">
  <header><div style="min-width:0"><span class="eyebrow">${esc(f.tag)} · ${pad(i+1)} · ${a.fase}</span><h2>${esc(a.nome)}</h2><div class="hint" style="margin-top:4px">${sc&&d?`${fDd(sc.i0)} → ${fDd(sc.i1)} · ${dias(d)}`:'Sem programação: defina a duração e o início do filtro'}</div></div>
  <div class="row" style="flex-wrap:nowrap"><button class="ic" data-a="dr-nav" data-v="-1" title="Atividade anterior">◀</button><button class="ic" data-a="dr-nav" data-v="1" title="Próxima atividade">▶</button><button class="ic" data-a="dr-close" title="Fechar" style="font-size:18px">✕</button></div></header>
  <div class="dr-body">
   <section class="grid2">
    ${fld('Atividade',`<textarea id="dn" rows="2" data-c="a-f" data-id="${a.id}" data-k="nome">${esc(a.nome)}</textarea>`,'full')}
    ${fld('Fase',`<select id="dfa" data-c="a-f" data-id="${a.id}" data-k="fase">${fasesOf(f).map(x=>opt(x,x==='COMPLEMENTAR'?'COMPLEMENTAR (não impacta a entrega)':x==='SERVICO'?'SERVIÇO':x,a.fase)).join('')}</select>`)}
    ${fld('Encarregado',`<select id="den" data-c="a-f" data-id="${a.id}" data-k="enc">${encOpts(a.enc)}</select>`)}
    ${fld('Duração (dias úteis)',`<input type="number" min="0" step="0.5" id="dd" value="${esc(a.dur)}" data-c="a-f" data-id="${a.id}" data-k="dur">`)}
    ${fld('Executar em paralelo com',`<select id="dp" data-c="a-f" data-id="${a.id}" data-k="par">${opt('','Não — sequencial',a.par)}${earlier.map((x,j)=>opt(x.id,pad(j+1)+' '+x.nome,a.par)).join('')}</select>`)}
    ${fld('Início'+(a.ini?' (fixo)':' (pela sequência)'),`<button class="dbtn ${a.ini?'fx':(sc?'auto':'nodate')}" style="height:34px;font-size:13px" id="di" data-a="cal" data-id="${a.id}" data-f="ini">${sc?(a.ini?'📌 ':'')+DNL[dayDate(sc.i0).getDay()]+' '+fDY(dayDate(sc.i0)):'＋ escolher data'}</button>`)}
    ${fld('Término',`<button class="dbtn ${sc&&d?'':'nodate'}" style="height:34px;font-size:13px" id="dt" data-a="cal" data-id="${a.id}" data-f="fim" ${sc?'':'disabled'}>${sc&&d?DNL[dayDate(sc.i1).getDay()]+' '+fDY(dayDate(sc.i1)):'—'}</button>`)}
    ${fld('Status',`<select id="dst" data-c="a-f" data-id="${a.id}" data-k="status">${STATUS.map(([k,l])=>opt(k,l,a.status)).join('')}</select>`)}
    ${fld('Avanço físico (%)',`<input type="number" min="0" max="100" id="dpc" value="${pctA(a)}" data-c="a-f" data-id="${a.id}" data-k="pct">`)}
    <label class="cpk" style="grid-column:1/-1;border-color:#8E6CC0" title="Continua na programação, mas não segura o término nem o prazo do filtro"><input type="checkbox" id="dni" data-c="a-f" data-id="${a.id}" data-k="ni" ${a.ni?'checked':''}> Não impacta o comissionamento (NI)</label>
    <label class="cpk" style="grid-column:1/-1" title="Para atividades feitas antes de usar esta programação: ficam concluídas, sem datas, e não aparecem em programações, alertas nem atrasos"><input type="checkbox" id="dfora" data-c="a-f" data-id="${a.id}" data-k="fora" ${a.fora?'checked':''}> Executada antes da programação (fora das datas e dos relatórios)</label>
    ${fld('Início real',`<input type="date" id="dri" value="${esc(a.rIni||'')}" max="${todayISO()}" data-c="a-f" data-id="${a.id}" data-k="rIni">`)}
    ${fld('Término real',`<input type="date" id="drf" value="${esc(a.rFim||'')}" max="${todayISO()}" data-c="a-f" data-id="${a.id}" data-k="rFim">`)}
    ${fld('Causa do atraso / desvio',`<select id="drc" data-c="a-f" data-id="${a.id}" data-k="causa">${opt('','—',a.causa||'')}${CAUSAS.map(c=>opt(c,c,a.causa||'')).join('')}</select>`)}
    <div class="hint" style="align-self:end">${a.bl?`Linha de base: ${fD(parseISO(a.bl.i))} → ${fD(parseISO(a.bl.f))} · ${dias(a.bl.d)}${devFim(a)!=null?' · desvio '+dvTxt(devFim(a)):''}`:'Sem linha de base (é salva no 1º apontamento)'}</div>
    ${fld('Observações',`<textarea id="dob" rows="2" data-c="a-f" data-id="${a.id}" data-k="obs">${esc(a.obs)}</textarea>`,'full')}
    ${a.ini?`<div class="full hint">📌 Início fixo. <button class="btn sm" data-a="q-unfix" data-id="${a.id}">Voltar à sequência</button></div>`:''}
    ${parallels.length?`<div class="full hint">Em paralelo com esta: ${parallels.map(x=>'<span class="badge b-par">∥ '+pad(f.ativ.indexOf(x)+1)+' '+esc(x.nome)+'</span>').join(' ')}</div>`:''}
   </section>
   <section><h3>RAC aplicáveis</h3><div class="racs">${RACS.map(r=>`<button class="rac" data-a="rac" data-id="${a.id}" data-v="${r}" aria-pressed="${a.rac.includes(r)}">${r}</button>`).join('')}</div></section>
   <section><h3>Pendências <span class="badge b-p">${a.pend.filter(p=>!p.ok).length} aberta(s)</span></h3>${pend||'<span class="hint">Nenhuma pendência.</span>'}
    <div class="addbox"><label class="f w4">Nova pendência<input type="text" id="npd" value="${esc(np.desc)}" data-u="np.desc" data-live="1" placeholder="ex.: aguardando liberação do guindaste"></label>
     <label class="f w2">Tipo<select id="npt" data-u="np.tipo">${TIPOS_PEND.map(x=>opt(x,x,np.tipo)).join('')}</select></label>
     <label class="f">Responsável<input type="text" id="npr" value="${esc(np.resp)}" data-u="np.resp" data-live="1"></label>
     <label class="f">Prazo<input type="date" id="npp" value="${esc(np.prazo)}" data-u="np.prazo"></label>
     <button class="btn pri w4" data-a="np-add" data-id="${a.id}">Adicionar pendência</button></div></section>
   <section><h3>Impactos <span class="badge b-i">${dias(a.imp.reduce((s,m)=>s+num(m.dias),0))}</span></h3>${imp||'<span class="hint">Nenhum impacto registrado.</span>'}
    <div class="addbox"><label class="f">Data<input type="date" id="nid" value="${esc(ni.data)}" data-u="ni.data"></label>
     <label class="f">Dias perdidos<input type="number" min="0" step="0.5" id="nidd" value="${esc(ni.d)}" data-u="ni.d" data-live="1"></label>
     <label class="f w2">Responsabilidade<select id="nir" data-u="ni.resp">${RESP_IMP.map(x=>opt(x,x,ni.resp)).join('')}</select></label>
     <label class="f w4">Tipo<select id="nit" data-u="ni.tipo">${TIPOS_IMP.map(x=>opt(x,x,ni.tipo)).join('')}</select></label>
     <label class="f w4">Descrição<input type="text" id="nids" value="${esc(ni.desc)}" data-u="ni.desc" data-live="1" placeholder="ex.: PTS liberada só à tarde"></label>
     <button class="btn pri w4" data-a="ni-add" data-id="${a.id}">Registrar impacto</button></div></section>
  </div></aside>`}

  if(v==='dup'){mut(()=>{const c=JSON.parse(JSON.stringify(a));c.id=uid();c.pend=[];c.imp=[];c.status='nao';c.pct=0;c.ini='';f.ativ.splice(i+1,0,c);U.sel=c.id;U.menu=null},'Atividade duplicada');return}
  if(v==='par'){if(!a.par&&i===0)return;mut(()=>{a.par=a.par?'':f.ativ[i-1].id;U.menu=null},a.par?'Marcação de paralela removida':'Marcada como paralela (as datas não mudam)');return}

  const first=new Date(m.getFullYear(),m.getMonth(),1);const g0=addDays(first,-first.getDay());const t=dayIdx(new Date());
  let cells=DN.map(d=>`<span class="dw">${d[0]}</span>`).join('');
  for(let k=0;k<42;k++){const d=addDays(g0,k);const i=dayIdx(d);const work=i>=0&&i<NDAYS&&CAL.cap[i];
    const cls=[d.getMonth()!==m.getMonth()?'out':'',work?'':'off',ctx.span&&i>=ctx.span[0]&&i<=ctx.span[1]?'span':'',i>=W.i0&&i<=W.i6?'wk':'',i===t?'td':'',i===ctx.cur?'sel':''].join(' ');
    cells+=`<button class="${cls}" data-a="cal-pick" data-v="${iso(d)}" title="${DNL[d.getDay()]} ${fDY(d)}${work?'':' — sem trabalho'}">${d.getDate()}</button>`}
  const w=300,h=ctx.fim?470:420;const left=Math.max(8,Math.min(c.x,innerWidth-w-8));const top=c.y+h>innerHeight?Math.max(8,c.y-h-36):c.y;
  return`<div class="calp" style="left:${left}px;top:${top}px" role="dialog" aria-label="Escolher data"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px"><b>${esc(ctx.title)}</b></div>
  <div class="cal-h"><button class="ic" data-a="cal-nav" data-v="-1" aria-label="Mês anterior">◀</button><b>${MES[m.getMonth()]} ${m.getFullYear()}</b><button class="ic" data-a="cal-nav" data-v="1" aria-label="Próximo mês">▶</button></div>
  ${ctx.fim?`<div class="seg" style="display:flex"><button class="st" style="flex:1" data-a="cal-fm" data-v="mover" aria-pressed="${U.fimModo==='mover'}">Manter duração</button><button class="st" style="flex:1" data-a="cal-fm" data-v="dur" aria-pressed="${U.fimModo==='dur'}">Mudar duração</button></div>`:''}
  <div class="cal-g">${cells}</div>
  <div class="hint">${esc(ctx.hint||'')}<br><span style="color:var(--mc-ink)">■</span> programado · <span style="color:var(--vy)">▁</span> semana selecionada · riscado = sem trabalho</div>
  <div class="row" style="justify-content:space-between"><button class="btn sm" data-a="cal-pick" data-v="${todayISO()}">Hoje</button>${ctx.clear?`<button class="btn sm" data-a="cal-clear">${ctx.clear}</button>`:''}<button class="btn sm" data-a="cal-close">Fechar</button></div></div>`}
Object.assign(ACT,{
  'logo-up':e=>{U.logoKey=e.dataset.v;$('#logoimp').click()},
  'logo-del':e=>mut(()=>{delete S.logos[e.dataset.v]},'Logo padrão restaurada'),
  cal:e=>{const r=e.getBoundingClientRect();U.cal={f:e.dataset.f,id:e.dataset.id,fid:e.dataset.fid,x:r.left,y:r.bottom+4};const ctx=calCtx();const base=ctx&&ctx.cur!=null?dayDate(ctx.cur):week().ws;U.cal.m=new Date(base.getFullYear(),base.getMonth(),1);U.menu=null;render()},
  'cal-nav':e=>{const m=U.cal.m;U.cal.m=new Date(m.getFullYear(),m.getMonth()+ +e.dataset.v,1);render()},
  'cal-close':()=>{U.cal=null;render()},
  'cal-fm':e=>{U.fimModo=e.dataset.v;render()},
  'cal-clear':()=>{const c=U.cal;U.cal=null;if(c.f==='finicio')mut(()=>{S.filtros.find(x=>x.id===c.fid).inicio=''},'Data de início removida');else mut(()=>{AIDX[c.id].a.ini=''},'Voltou para a sequência')},
  'cal-pick':e=>{const c=U.cal;const v=e.dataset.v;U.cal=null;const dd=parseISO(v);
    if(c.f==='finicio'){const f=S.filtros.find(x=>x.id===c.fid);mut(()=>shiftFiltroTo(f,dayIdx(dd),false),`${f.tag} inicia ${DN[dd.getDay()]} ${fDY(dd)} — durações mantidas`);return}
    if(c.f==='ffim'){const f=S.filtros.find(x=>x.id===c.fid);const ap=S.filtros.find(x=>x.id===f.apos);
      mut(()=>endFiltroAt(f,dayIdx(dd)),`${f.tag} reprogramado para terminar ${DN[dd.getDay()]} ${fDY(dd)} — durações mantidas${ap?` (deixou de seguir ${ap.tag})`:''}`);return}
    const r=AIDX[c.id];if(!r){render();return}const a=r.a;
    if(c.f==='ini'){mut(()=>{a.ini=v},`Início ${DN[dd.getDay()]} ${fDY(dd)}`);return}
    const sc=SCH[a.id];if(!sc){toast('Escolha o início antes do término');render();return}
    if(U.fimModo==='mover'){const d=num(a.dur);const E=endOffOfDay(dayIdx(dd));const si=d?offDay(Math.max(0,E-d),false):dayIdx(dd);
      mut(()=>{a.ini=iso(dayDate(si))},`Reprogramada: ${DN[dayDate(si).getDay()]} ${fD(dayDate(si))} → ${fD(dd)} · ${dias(d)} mantidos`);return}
    const nd=endOffOfDay(dayIdx(dd))-sc.s;if(nd<=0){toast('O término precisa ser no mesmo dia ou depois do início');render();return}
    mut(()=>{a.dur=String(Math.round(nd*2)/2)},'Término '+fD(dd)+' · '+dias(Math.round(nd*2)/2))},
});

render();
</script>
